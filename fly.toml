# fly.toml app configuration file generated for orviqo on 2026-07-13T02:24:15+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'orviqo'
primary_region = 'fra'  # Frankfurt — co-located with the Neon Postgres (EU Central)

[build]

[deploy]
  release_command = 'alembic upgrade head'

# Two process groups on their own machines: the web service (webhook) and the
# reminder worker (a daily loop). `fly deploy` runs both.
[processes]
  web = 'uvicorn --factory orviqo.api.webhook:create_app --host 0.0.0.0 --port 8000'
  worker = 'python -m orviqo.worker'

[http_service]
  internal_port = 8000
  processes = ['web']
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
