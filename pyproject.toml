[project]
name = "orviqo"
version = "0.1.0"
description = "WhatsApp-native receivables agent for Nigerian SMBs"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[anthropic,google]>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.18.5",
]

[project.scripts]
orviqo = "orviqo.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

# Vercel: serve the FastAPI ``app`` from this module, and apply migrations at build
# time (the Vercel counterpart of fly.toml's release_command).
[tool.vercel]
entrypoint = "orviqo.api.webhook:app"

[tool.vercel.scripts]
build = "alembic upgrade head"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orviqo"]

[tool.ruff]
line-length = 100
src = ["orviqo", "tests"]
extend-exclude = ["migrations"]  # Alembic-generated; not hand-linted

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
packages = ["orviqo"]
ignore_missing_imports = true
check_untyped_defs = true
